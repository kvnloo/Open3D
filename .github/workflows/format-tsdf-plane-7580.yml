name: Format TSDF plane 7580

on:
  push:
    branches: [ci/format-tsdf-plane-7580]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U -r python/requirements_style.txt
      - name: Apply repository formatter
        run: |
          python util/check_style.py --apply --no_parallel
          git diff --check
          printf '%s\n' cpp/tests/t/geometry/VoxelBlockGridPlane.cpp python/test/t/geometry/test_voxel_block_grid_surface.py > expected.txt
          git diff --name-only | sort > actual.txt
          diff -u expected.txt actual.txt
          for file in cpp/tests/t/geometry/VoxelBlockGridPlane.cpp python/test/t/geometry/test_voxel_block_grid_surface.py; do
            echo "===FORMATTED_BASE64:$file==="
            base64 -w0 "$file"
            echo
            echo "===END_FORMATTED_BASE64:$file==="
          done

# trigger: validation rerun
