name: Probe VBG negative IO 6795

on:
  push:
    branches: [ci/probe-vbg-negative-6795]

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    env:
      OPEN3D_CPU_RENDERING: 'true'
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install runtime dependencies
        run: util/install_deps_ubuntu.sh assume-yes
      - name: Download source-built current production wheel
        uses: actions/download-artifact@v4
        with:
          repository: kvnloo/Open3D
          run-id: 36031031023
          github-token: ${{ github.token }}
          name: open3d-0.20.0+6af86e9-cp314-cp314-manylinux_2_35_x86_64.whl
          path: wheel
      - name: Install CPU wheel
        run: |
          set -euxo pipefail
          python -m pip install -U numpy
          shopt -s nullglob
          cpu=(wheel/open3d_cpu*.whl)
          test ${#cpu[@]} -eq 1
          python -m pip install "${cpu[0]}"
      - name: Probe negative-coordinate save/load and downstream use
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import numpy as np
          import open3d as o3d

          dev = o3d.core.Device("CPU:0")
          width, height = 64, 48
          depth_np = np.full((height, width, 1), 1.2, dtype=np.float32)
          depth = o3d.t.geometry.Image(o3d.core.Tensor(depth_np, device=dev))
          intrinsic = o3d.core.Tensor(
              [[50.0, 0.0, 31.5], [0.0, 50.0, 23.5], [0.0, 0.0, 1.0]],
              dtype=o3d.core.Dtype.Float64)
          extrinsic = o3d.core.Tensor.eye(4, o3d.core.Dtype.Float64)

          grid = o3d.t.geometry.VoxelBlockGrid(
              attr_names=("tsdf", "weight"),
              attr_dtypes=(o3d.core.Dtype.Float32, o3d.core.Dtype.Float32),
              attr_channels=((1,), (1,)),
              voxel_size=0.02,
              block_resolution=8,
              block_count=2048,
              device=dev)

          coords = grid.compute_unique_block_coordinates(
              depth, intrinsic, extrinsic,
              depth_scale=1.0, depth_max=3.0, trunc_voxel_multiplier=8.0)
          coords_np = coords.cpu().numpy()
          assert coords_np.shape[1] == 3
          assert np.any(coords_np < 0), coords_np

          grid.integrate(coords, depth, intrinsic, extrinsic,
                         depth_scale=1.0, depth_max=3.0,
                         trunc_voxel_multiplier=8.0)

          def active_keys(vbg):
              hm = vbg.hashmap()
              idx = hm.active_buf_indices().to(o3d.core.Dtype.Int64)
              return hm.key_tensor()[idx].cpu().numpy()

          before = active_keys(grid)
          assert len(before) > 0
          assert np.any(before < 0), before

          with tempfile.TemporaryDirectory() as td:
              path = str(Path(td) / "negative-vbg.npz")
              grid.save(path)
              loaded = o3d.t.geometry.VoxelBlockGrid.load(path)

              after = active_keys(loaded)
              assert len(after) == len(before)
              before_sorted = np.array(sorted(map(tuple, before.tolist())))
              after_sorted = np.array(sorted(map(tuple, after.tolist())))
              np.testing.assert_array_equal(after_sorted, before_sorted)
              assert np.any(after < 0)

              p0 = grid.extract_point_cloud(weight_threshold=0.5)
              p1 = loaded.extract_point_cloud(weight_threshold=0.5)
              n0 = int(p0.point.positions.shape[0])
              n1 = int(p1.point.positions.shape[0])
              assert n0 > 0
              assert n1 == n0, (n0, n1)

              def cast(vbg):
                  result = vbg.ray_cast(
                      coords, intrinsic, extrinsic, width, height,
                      ["depth"], depth_scale=1.0, depth_min=0.1,
                      depth_max=3.0, weight_threshold=0.5,
                      trunc_voxel_multiplier=8.0, range_map_down_factor=8)
                  return result["depth"].cpu().numpy()

              before_depth = cast(grid)
              after_depth = cast(loaded)
              assert before_depth.shape == after_depth.shape
              before_valid = np.isfinite(before_depth) & (before_depth > 0)
              after_valid = np.isfinite(after_depth) & (after_depth > 0)
              np.testing.assert_array_equal(after_valid, before_valid)
              if before_valid.any():
                  np.testing.assert_allclose(
                      after_depth[before_valid], before_depth[before_valid],
                      rtol=1e-5, atol=1e-6)

              report = {
                  "open3d_version": o3d.__version__,
                  "computed_block_count": int(coords_np.shape[0]),
                  "active_blocks_before": int(len(before)),
                  "active_blocks_after": int(len(after)),
                  "negative_key_components_before": int((before < 0).sum()),
                  "negative_key_components_after": int((after < 0).sum()),
                  "points_before": n0,
                  "points_after": n1,
                  "raycast_positive_finite_pixels_before": int(before_valid.sum()),
                  "raycast_positive_finite_pixels_after": int(after_valid.sum()),
              }
              print("VBG_NEGATIVE_IO_PROBE", json.dumps(report, sort_keys=True))
          PY

