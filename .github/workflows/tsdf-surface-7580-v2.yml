name: TSDF 7580 fixed-input surfaces v2
on:
  push:
    branches: [ci/tsdf-surface-7580-v2]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  surface:
    if: github.repository == 'kvnloo/Open3D'
    runs-on: macos-14
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          mkdir -p results
          git rev-parse HEAD > results/validation-commit.txt
          python -m pip install requests
      - name: Verify exact original artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python validation/tsdf7580/provenance.py metadata
      - uses: actions/download-artifact@v4
        with:
          name: open3d-0.20.0+337b457-cp314-cp314-macosx_11_0_arm64.whl
          run-id: 35964996507
          github-token: ${{ github.token }}
          path: wheels/control
      - uses: actions/download-artifact@v4
        with:
          name: open3d-0.20.0+203aff2-cp314-cp314-macosx_11_0_arm64.whl
          run-id: 35965027760
          github-token: ${{ github.token }}
          path: wheels/candidate
      - name: Prepare the same nondegenerate extraction fixture for both builds
        run: |
          # Preserve failed-attempt evidence. Both adjustments below concern
          # fixture construction, not the production depth-lookup correction.
          python - <<'PY'
          from pathlib import Path
          p = Path('validation/tsdf7580/surface_probe.py')
          text = p.read_text()
          old = "attr_names=('tsdf', 'weight'), attr_dtypes=(c.float32, c.float32),\n                    attr_channels=((1,), (1,)),"
          new = "attr_names=('tsdf', 'weight', 'color'), attr_dtypes=(c.float32, c.float32, c.float32),\n                    attr_channels=((1,), (1,), (3,)),"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "                grid.attribute('tsdf')[:] = 0.\n"
          assert text.count(old) == 1
          text = text.replace(old, old + "                grid.attribute('color')[:] = 0.\n")
          # The existing point extractor uses tsdf_i * tsdf_o < 0: an exactly
          # voxel-aligned flat plane has no strict sign-changing edge. Move
          # the analytic plane off that grid coincidence in BOTH inputs.
          assert text.count('1.25') == 3
          text = text.replace('1.25', '1.253')
          p.write_text(text)
          Path('results/effective_surface_probe.py').write_text(text)
          PY
          git diff -- validation/tsdf7580/surface_probe.py > results/fixture-adjustment.patch
          python -m py_compile validation/tsdf7580/*.py
      - name: Install control and generate fixed inputs once
        run: |
          shasum -a 256 wheels/*/*.whl > results/wheel-sha256.txt
          python -m pip install wheels/control/*.whl pytest==8.3.5
          python -m pip freeze > results/control-environment.txt
          python validation/tsdf7580/surface_probe.py generate
          shasum -a 256 validation/tsdf7580/surface_probe.py > results/probe-sha256.txt
      - name: Measure original reconstruction
        run: python validation/tsdf7580/surface_probe.py probe --label control --version 0.20.0+337b457 --output results/control.json 2>&1 | tee results/control.log
      - name: Swap only Open3D and verify unchanged environment
        run: |
          python -m pip install --no-deps --force-reinstall wheels/candidate/*.whl
          python -m pip freeze > results/candidate-environment.txt
          python - <<'PY'
          from pathlib import Path
          def deps(p):
              return [s for s in Path(p).read_text().splitlines() if not s.lower().startswith('open3d')]
          assert deps('results/control-environment.txt') == deps('results/candidate-environment.txt')
          PY
          shasum -a 256 -c results/probe-sha256.txt
      - name: Measure candidate with identical input files
        run: python validation/tsdf7580/surface_probe.py probe --label candidate --version 0.20.0+203aff2 --output results/candidate.json 2>&1 | tee results/candidate.log
      - name: Compare physical surface error without revising reference counts
        run: |
          python validation/tsdf7580/surface_probe.py compare --output results/surface-comparison.md
          cat results/surface-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsdf-7580-fixed-input-surface-v2
          path: results/
          if-no-files-found: error
          retention-days: 14
